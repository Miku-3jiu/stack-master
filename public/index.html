<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>轻游盒子 - 游戏大厅</title>
<link rel="stylesheet" href="css/style.css">
<style>
  body { overflow-y:auto !important; height:auto !important; min-height:100vh; }
  .lobby { max-width:480px; margin:0 auto; padding:20px; text-align:center; color:#fff; }
  .lobby h1 { font-size:28px; margin-bottom:4px; }
  .lobby .slogan { color:#888; font-size:13px; margin-bottom:20px; }
  .user-row { display:flex; justify-content:center; align-items:center; gap:10px; margin-bottom:16px; }
  .game-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; margin:18px 0; }
  .game-card {
    background:rgba(22,22,55,0.96); border-radius:18px; padding:20px 14px;
    text-align:center; cursor:pointer; transition:transform 0.15s,box-shadow 0.15s;
    border:1px solid rgba(255,255,255,0.08); text-decoration:none; color:#e0e0e0;
    display:block;
  }
  .game-card:hover { transform:translateY(-2px); box-shadow:0 8px 24px rgba(0,0,0,0.3); }
  .game-card .icon { font-size:44px; margin-bottom:8px; }
  .game-card .name { font-size:15px; font-weight:700; margin-bottom:4px; }
  .game-card .info { font-size:11px; color:#777; }
  .game-card.stack { border-left:3px solid #ff6b6b; }
  .game-card.memory { border-left:3px solid #ffd700; }
  .game-card.reaction { border-left:3px solid #51cf66; }
  .game-card.math { border-left:3px solid #6bc5ff; }
  .bottom-nav { display:flex; justify-content:center; gap:8px; flex-wrap:wrap; margin:20px 0 30px; }
</style>
</head>
<body>

<div class="lobby">
  <h1>🏗️ 轻游盒子</h1>
  <p class="slogan">休闲游戏平台 · 挑战你的极限</p>

  <div class="user-row" id="userRow"></div>

  <div class="game-grid">
    <a href="game.html" class="game-card stack">
      <div class="icon">🏗️</div>
      <div class="name">叠塔大师</div>
      <div class="info">精准堆叠 · 三层难度</div>
    </a>
    <a href="game-memory.html" class="game-card memory">
      <div class="icon">🧠</div>
      <div class="name">记忆翻牌</div>
      <div class="info">翻转配对 · 考验脑力</div>
    </a>
    <a href="game-reaction.html" class="game-card reaction">
      <div class="icon">🎯</div>
      <div class="name">反应速度</div>
      <div class="info">毫秒之间 · 挑战极限</div>
    </a>
    <a href="game-math.html" class="game-card math">
      <div class="icon">🧮</div>
      <div class="name">算数挑战</div>
      <div class="info">快问快答 · 限时15秒</div>
    </a>
  </div>

  <div class="bottom-nav">
    <button class="btn-sm" onclick="App.Shop.show()">🛒 商城</button>
    <button class="btn-sm" onclick="App.LB.show()">🏆 排行</button>
    <a href="profile.html"><button class="btn-sm">👤 个人</button></a>
    <a href="admin.html"><button class="btn-sm">🛡️ 管理</button></a>
  </div>
</div>

<!-- 商城 overlay -->
<div id="shopUI" class="overlay">
  <div class="panel" style="max-width:380px;">
    <h2>🛒 商城</h2>
    <div id="shopContent"></div>
    <p style="font-size:11px;color:#666;margin-top:8px;">模拟支付环境，上线时接入真实支付</p>
    <button class="btn-sm" onclick="App.UI.hide('shopUI')">返回</button>
  </div>
</div>

<!-- 支付 overlay -->
<div id="payUI" class="overlay">
  <div class="panel" id="payContent"></div>
</div>

<!-- 排行榜 overlay -->
<div id="lbUI" class="overlay">
  <div class="panel">
    <h2>🏆 排行榜</h2>
    <div style="display:flex;gap:6px;justify-content:center;margin-bottom:10px;" id="lbTabs"></div>
    <div id="lbContent" style="max-height:300px;overflow-y:auto;"></div>
    <button class="btn-sm" onclick="App.UI.hide('lbUI')">返回</button>
  </div>
</div>

<div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/shop.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/home.js"></script>
</body>
</html>
