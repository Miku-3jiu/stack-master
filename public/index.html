<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>叠塔大师 - Stack Master</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .home-wrap {
    width:100vw; max-width:480px; min-height:100vh;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    padding:40px 20px; text-align:center;
  }
  .logo { font-size:56px; margin-bottom:8px; }
  .title { font-size:36px; font-weight:900; color:#fff; margin-bottom:4px; }
  .title-en { font-size:16px; color:#888; margin-bottom:30px; letter-spacing:2px; }
  .menu-btn { display:block; width:220px; margin:8px auto; }
  .user-bar { margin-bottom:20px; }
  .user-bar .name { color:#ffd700; font-size:16px; font-weight:700; }
</style>
</head>
<body>

<div class="home-wrap">
  <div class="logo">🏗️</div>
  <div class="title">叠塔大师</div>
  <div class="title-en">STACK MASTER</div>

  <div class="user-bar" id="userBar"></div>

  <button class="btn menu-btn" onclick="location.href='game.html'">🎮 开始游戏</button>
  <button class="btn-sm menu-btn" onclick="App.Shop.show()">🎨 皮肤商城</button>
  <button class="btn-sm menu-btn" onclick="App.LB.show()">🏆 排行榜</button>

  <div id="authBtns" style="margin-top:20px;"></div>

  <p style="font-size:11px;color:#555;margin-top:20px;" id="skinInfo">当前皮肤：经典木纹</p>
</div>

<!-- 皮肤商城 overlay -->
<div id="shopUI" class="overlay">
  <div class="panel" style="max-width:380px;">
    <h2>🛒 商城</h2>
    <div id="shopContent"></div>
    <p style="font-size:11px;color:#666;margin-top:8px;">模拟支付环境，上线时接入真实支付</p>
    <button class="btn-sm" onclick="App.UI.hide('shopUI')">返回</button>
  </div>
</div>

<!-- 支付 overlay -->
<div id="payUI" class="overlay">
  <div class="panel" id="payContent"></div>
</div>

<!-- 排行榜 overlay -->
<div id="lbUI" class="overlay">
  <div class="panel">
    <h2>🏆 排行榜</h2>
    <div id="lbContent" style="max-height:300px;overflow-y:auto;"></div>
    <button class="btn-sm" onclick="App.UI.hide('lbUI')">返回</button>
  </div>
</div>

<!-- Toast -->
<div id="toast"></div>

<script src="js/config.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
<script src="js/shop.js"></script>
<script src="js/leaderboard.js"></script>
<script src="js/home.js"></script>
</body>
</html>
