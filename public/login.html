<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>登录 - 叠塔大师</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-page {
    width:100vw; max-width:480px; min-height:100vh;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    padding:20px;
  }
  .auth-panel {
    background:rgba(22,22,55,0.96); border-radius:20px; padding:32px 24px;
    text-align:center; color:#e0e0e0; border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 20px 60px rgba(0,0,0,0.5); width:100%; max-width:340px;
  }
  .auth-form { text-align:left; }
  .auth-form label { display:block; font-size:13px; color:#999; margin:12px 0 4px; }
  .auth-form input {
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.06); color:#fff; font-size:15px; outline:none;
    transition:border-color 0.2s;
  }
  .auth-form input:focus { border-color:#ff6b6b; }
  .auth-error { color:#ff6b6b; font-size:13px; margin-top:8px; min-height:20px; }
  .auth-link { font-size:13px; color:#888; margin-top:14px; }
  .auth-link a { color:#ff6b6b; text-decoration:underline; cursor:pointer; }
</style>
</head>
<body>

<div class="auth-page">
  <div class="auth-panel">
    <h2>🔑 登录</h2>
    <p class="sub">登录后保存成绩并参与排行</p>
    <div class="auth-form">
      <label>用户名</label>
      <input type="text" id="loginUser" placeholder="请输入用户名" maxlength="20" autocomplete="username">
      <label>密码</label>
      <input type="password" id="loginPass" placeholder="请输入密码" maxlength="100" autocomplete="current-password">
      <p class="auth-error" id="loginError"></p>
      <button class="btn" onclick="doLogin()" style="width:100%;margin-top:10px;">登录</button>
    </div>
    <p class="auth-link">还没有账号？<a href="register.html">去注册</a></p>
    <button class="btn-sm" onclick="location.href='index.html'" style="margin-top:8px;">← 返回首页</button>
  </div>
</div>

<div id="toast"></div>

<script>
function doLogin() {
  var u = document.getElementById('loginUser').value.trim();
  var p = document.getElementById('loginPass').value;
  var err = document.getElementById('loginError');
  if (!u || !p) { err.textContent = '请填写用户名和密码'; return; }

  err.textContent = '登录中...';
  fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: u, password: p })
  }).then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) { err.textContent = data.error; return; }
      localStorage.setItem('sm_token', data.token);
      window.location.href = 'index.html';
    }).catch(function(e) {
      err.textContent = '网络错误：' + e.message;
    });
}

document.getElementById('loginPass').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});
</script>
</body>
</html>
