<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>注册 - 轻游盒子</title>
<link rel="stylesheet" href="css/style.css">
<style>
  .auth-page {
    width:100vw; max-width:480px; min-height:100vh;
    display:flex; flex-direction:column; justify-content:center; align-items:center;
    padding:20px;
  }
  .auth-panel {
    background:rgba(22,22,55,0.96); border-radius:20px; padding:32px 24px;
    text-align:center; color:#e0e0e0; border:1px solid rgba(255,255,255,0.1);
    box-shadow:0 20px 60px rgba(0,0,0,0.5); width:100%; max-width:340px;
  }
  .auth-form { text-align:left; }
  .auth-form label { display:block; font-size:13px; color:#999; margin:12px 0 4px; }
  .auth-form input {
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid rgba(255,255,255,0.15);
    background:rgba(255,255,255,0.06); color:#fff; font-size:15px; outline:none;
  }
  .auth-form input:focus { border-color:#ff6b6b; }
  .auth-error { color:#ff6b6b; font-size:13px; margin-top:8px; min-height:20px; }
  .auth-link { font-size:13px; color:#888; margin-top:14px; }
  .auth-link a { color:#ff6b6b; text-decoration:underline; cursor:pointer; }
</style>
</head>
<body>

<div class="auth-page">
  <div class="auth-panel">
    <h2>📝 注册</h2>
    <p class="sub">创建账号，保存成绩和皮肤</p>
    <div class="auth-form">
      <label>用户名</label>
      <input type="text" id="regUser" placeholder="3-20个字符" maxlength="20" autocomplete="username">
      <label>密码</label>
      <input type="password" id="regPass" placeholder="至少6个字符" maxlength="100" autocomplete="new-password">
      <label>确认密码</label>
      <input type="password" id="regPass2" placeholder="再次输入密码" maxlength="100" autocomplete="new-password">
      <p class="auth-error" id="regError"></p>
      <button class="btn" onclick="doRegister()" style="width:100%;margin-top:10px;">注册</button>
    </div>
    <p class="auth-link">已有账号？<a href="login.html">去登录</a></p>
    <button class="btn-sm" onclick="location.href='index.html'" style="margin-top:8px;">← 返回首页</button>
  </div>
</div>

<div id="toast"></div>

<script src="js/config.js"></script>
<script>
function doRegister() {
  var u = document.getElementById('regUser').value.trim();
  var p = document.getElementById('regPass').value;
  var p2 = document.getElementById('regPass2').value;
  var err = document.getElementById('regError');
  if (u.length < 3) { err.textContent = '用户名至少3个字符'; return; }
  if (p.length < 6) { err.textContent = '密码至少6个字符'; return; }
  if (p !== p2) { err.textContent = '两次密码不一致'; return; }

  err.textContent = '注册中...';
  fetch('/api/auth/register', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ username: u, password: p })
  }).then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) { err.textContent = data.error; return; }
      localStorage.setItem('sm_token', data.token);
      window.location.href = 'index.html';
    }).catch(function(e) {
      err.textContent = '网络错误：' + e.message;
    });
}

document.getElementById('regPass2').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doRegister();
});
</script>
</body>
</html>
